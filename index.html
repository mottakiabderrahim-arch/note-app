<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Mini Excel PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{font-family:Arial;background:#f0f0f0;text-align:center;margin:10px}
table{border-collapse:collapse;margin:auto;background:#fff}
th,td{border:1px solid #000;padding:6px;width:80px;text-align:center}
th{background:#eee}
.result{background:#d0f0d0;font-weight:bold}
button{padding:6px;margin:2px}
</style>
</head>

<body>

<h3>Mini Excel</h3>

<button onclick="newFile()">ملف جديد</button>
<select id="fileList" onchange="openFile()"></select>
<button onclick="deleteFile()">حذف</button>

<br><br>

<button onclick="createTable()">إنشاء جدول</button>

<button onclick="toggleOp('sum')">جمع</button>
<button onclick="toggleOp('sub')">طرح</button>
<button onclick="toggleOp('mul')">ضرب</button>
<button onclick="toggleOp('div')">قسمة</button>

<br><br>

<button onclick="addRow()">صف +</button>
<button onclick="addCol()">عمود +</button>
<button onclick="delRow()">صف -</button>
<button onclick="delCol()">عمود -</button>

<br><br>

<button onclick="exportPDF()">PDF</button>
<button onclick="exportExcel()">Excel</button>
<button onclick="exportWord()">Word</button>
<button onclick="exportCSV()">CSV</button>

<br><br>

<div id="tableContainer"></div>

<script>

let table
let currentFile=null

let files=JSON.parse(localStorage.getItem("excelFiles")||"[]")

let numRows=5
let numCols=5

let enabledOps={sum:true,sub:false,mul:false,div:false}

let data=[]

// ===== الملفات =====

function updateFileList(){
fileList.innerHTML=""
files.forEach(f=>{
let o=document.createElement("option")
o.value=f
o.text=f
fileList.appendChild(o)
})
}

function newFile(){

let name=prompt("اسم الملف")

if(!name)return

files.push(name)

localStorage.setItem("excelFiles",JSON.stringify(files))

currentFile=name

createTable()

updateFileList()

}

function openFile(){

currentFile=fileList.value

let s=localStorage.getItem("excel_"+currentFile)

if(!s)return

let obj=JSON.parse(s)

data=obj.data

numRows=obj.rows

numCols=obj.cols

enabledOps=obj.ops

buildTable()

}

function deleteFile(){

if(!currentFile)return

localStorage.removeItem("excel_"+currentFile)

files=files.filter(f=>f!=currentFile)

localStorage.setItem("excelFiles",JSON.stringify(files))

currentFile=null

updateFileList()

tableContainer.innerHTML=""

}

// ===== الجدول =====

function createTable(){

data=[]

for(let r=0;r<numRows;r++){

data[r]=[]

for(let c=0;c<numCols;c++){

data[r][c]={text:""}

}

}

buildTable()

saveAll()

}

function buildTable(){

let html="<table id='dynamicTable'>"

for(let r=0;r<numRows;r++){

html+="<tr>"

for(let c=0;c<numCols;c++){

let cell=data[r][c]

html+=`<td contenteditable oninput="updateCell(this,${r},${c})">${cell.text}</td>`

}

html+="</tr>"

}

if(enabledOps.sum)html+=resultRow("sum")
if(enabledOps.sub)html+=resultRow("sub")
if(enabledOps.mul)html+=resultRow("mul")
if(enabledOps.div)html+=resultRow("div")

html+="</table>"

tableContainer.innerHTML=html

table=document.getElementById("dynamicTable")

calculate()

}

function resultRow(type){

let html="<tr>"

for(let c=0;c<numCols;c++){

html+=`<th class="result" id="${type}_${c}">0</th>`

}

html+="</tr>"

return html

}

function updateCell(td,r,c){

data[r][c].text=td.innerText

calculate()

saveAll()

}

// ===== العمليات =====

function calculate(){

for(let c=0;c<numCols;c++){

let vals=data.map(r=>parseFloat(r[c].text)||0)

let sum=vals.reduce((a,b)=>a+b,0)

let sub=vals.reduce((a,b)=>a-b)

let mul=vals.reduce((a,b)=>a*b,1)

let div=vals.reduce((a,b)=>b? a/b:0)

if(enabledOps.sum)setResult("sum",c,sum)

if(enabledOps.sub)setResult("sub",c,sub)

if(enabledOps.mul)setResult("mul",c,mul)

if(enabledOps.div)setResult("div",c,div)

}

}

function setResult(type,c,val){

let el=document.getElementById(type+"_"+c)

if(el)el.innerText=val

}

function toggleOp(op){

enabledOps[op]=!enabledOps[op]

buildTable()

saveAll()

}

// ===== صفوف وأعمدة =====

function addRow(){

let row=[]

for(let c=0;c<numCols;c++)row.push({text:""})

data.push(row)

numRows++

buildTable()

saveAll()

}

function addCol(){

data.forEach(r=>r.push({text:""}))

numCols++

buildTable()

saveAll()

}

function delRow(){

if(numRows<=1)return

data.pop()

numRows--

buildTable()

saveAll()

}

function delCol(){

if(numCols<=1)return

data.forEach(r=>r.pop())

numCols--

buildTable()

saveAll()

}

// ===== حفظ =====

function saveAll(){

if(!currentFile)return

localStorage.setItem("excel_"+currentFile,JSON.stringify({

data:data,

rows:numRows,

cols:numCols,

ops:enabledOps

}))

}

// ===== تصدير =====

function downloadFile(blob,filename){

let url=URL.createObjectURL(blob)

let a=document.createElement("a")

a.href=url

a.download=filename

document.body.appendChild(a)

a.click()

setTimeout(()=>{

document.body.removeChild(a)

URL.revokeObjectURL(url)

},100)

}

function exportPDF(){

if(!table)return

html2pdf().from(table).save(currentFile+".pdf")

}

function exportExcel(){

let blob=new Blob(['\ufeff'+table.outerHTML],{type:"application/vnd.ms-excel"})

downloadFile(blob,currentFile+".xls")

}

function exportWord(){

let blob=new Blob(['\ufeff'+table.outerHTML],{type:"application/msword"})

downloadFile(blob,currentFile+".doc")

}

function exportCSV(){

let csv=""

data.forEach(r=>{

csv+=r.map(c=>`"${c.text}"`).join(",")+"\n"

})

let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"})

downloadFile(blob,currentFile+".csv")

}

updateFileList()

</script>

</body>
</html>
