<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TTS Generator</title>
</head>
<body>

<h2>Words to MP3</h2>

<textarea id="text" rows="10" cols="40">
hello
book
car
house
</textarea>

<br><br>

<button onclick="generate()">Generate MP3</button>

<script>
async function generate() {
    let words = document.getElementById("text").value.split("\n");

    for (let i = 0; i < words.length; i++) {
        let word = words[i].trim();
        if (!word) continue;

        let url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=" 
                  + encodeURIComponent(word);

        let a = document.createElement("a");
        a.href = url;
        a.download = word + ".mp3";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        await new Promise(r => setTimeout(r, 1500));
    }

    alert("Done");
}
</script>

</body>
</html>
