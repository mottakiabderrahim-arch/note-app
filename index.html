<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاحظاتي</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#1e293b; --muted:#64748b;
  --accent:#4f46e5; --border:#e2e8f0; --shadow:0 4px 12px rgba(0,0,0,.06)
}
.dark{--bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
  --border:#334155; --shadow:0 4px 12px rgba(0,0,0,.3)}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.3s}
header{position:sticky;top:0;background:var(--card);padding:14px 20px;
  display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);z-index:10}
header input{flex:1;padding:10px 14px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--text);outline:none}
.btn{padding:9px 14px;border:none;border-radius:9px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600;transition:.2s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--text);border:1px solid va
r(--border)}
.container{max-width:1000px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.note{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.note.pinned{border-color:var(--accent)}
.note h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.note textarea{flex:1;min-height:120px;border:none;outline:none;background:transparent;
  color:var(--text);resize:vertical;font-size:14px;line-height:1.6}
.note img{max-width:100%;border-radius:8px;margin-top:6px}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--border)}
.footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.footer button{padding:6px 10px;font-size:12px;border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer}
.lock-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:99}
.lock-box{background:var(--card);padding:30px;border-radius:16px;box-shadow:var(--shadow);
  text-align:center;width:300px}
.lock-box input{width:100%;padding:10px;border:1px solid var(--border);
  border-radius:8px;margin:12px 0;background:var(--bg);color:var(--text)}
.hidden{display:none}
</style>
</head>
<body>
<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h2>🔒 كلمة السر</h2>
    <input type="password" id="pwdInput" placeholder="دخل كلمة السر">
    <button class="btn" onclick="unlock()">دخول</button>
    <p style="font-size:12px;color:var(--muted)">أول مرة؟ دخل أي كلمة سر للتسجيل</p>
  </div>
</div>

<header>
  <input type="text" id="search" placeholder="🔍 بحث فالملاحظات...">
  <button class="btn ghost" onclick="toggleDark()">🌓</button>
  <button class="btn" onclick="newNote()">+ ملاحظة</button>
</header>

<div class="container">
  <div id="notesGrid" class="grid"></div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('notes')||'[]');
let dark = localStorage.getItem('dark')==='1';
let pwd = localStorage.getItem('pwd');

if(dark) document.body.classList.add('dark');
if(!pwd) document.getElementById('lockScreen').classList.remove('hidden');
else if(pwd) document.getElementById('lockScreen').classList.add('hidden');

function unlock(){
  let v = document.getElementById('pwdInput').value;
  if(!pwd){ localStorage.setItem('pwd',v); }
  if(v===localStorage.getItem('pwd')){
    document.getElementById('lockScreen').classList.add('hidden');
  } else alert('كلمة السر غلط');
}

function save(){ localStorage.setItem('notes',JSON.stringify(notes)); render(); }
function uid(){ return Date.now().toString(36) }

function newNote(){
  notes.unshift({id:uid(),title:'ملاحظة جديدة',content:'',tags:[],pinned:false,img:null,created:Date.now()});
  save();
}

function del(id){ notes=notes.filter(n=>n.id!=id); save(); }
function togglePin(id){ let n=notes.find(x=>x.id==id); n.pinned=!n.pinned;
  notes.sort((a,b)=>b.pinned-a.pinned); save(); }
function update(id,field,val){ let n=notes.find(x=>x.id==id); n[field]=val; save(); }

function uploadImg(id,e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=()=>{ update(id,'img',r.result); }
  r.readAsDataURL(f);
}

function exportTxt(id){
  let n=notes.find(x=>x.id==id);
  let blob=new Blob([n.title+'\n\n'+n.content],{type:'text/plain'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=n.title+'.txt'; a.click();
}

function backup(){
  let blob=new Blob([JSON.stringify(notes)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='backup_'+Date.now()+'.json'; a.click();
}

function restore(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=()=>{ notes=JSON.parse(r.result); save(); }
  r.readAsText(f);
}

function wordCount(txt){ return txt.trim().split(/\s+/).filter(Boolean).length }

function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let filtered=notes.filter(n=>
    n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q) ||
    n.tags.join(' ').toLowerCase().includes(q)
  );
  document.getElementById('notesGrid').innerHTML=filtered.map(n=>`
    <div class="note ${n.pinned?'pinned':''}">
      <h3>
        <input value="${n.title}" oninput="update('${n.id}','title',this.value)"
          style="border:none;background:transparent;color:var(--text);font-weight:700;flex:1">
        <span style="cursor:pointer" onclick="togglePin('${n.id}')">${n.pinned?'📌':'📍'}</span>
      </h3>
      <textarea oninput="update('${n.id}','content',this.value)">${n.content}</textarea>
      ${n.img?`<img src="${n.img}">`:''}
      <input type="text" placeholder="تصنيفات بفاصلة" value="${n.tags.join(',')}"
        oninput="update('${n.id}','tags',this.value.split(',').map(t=>t.trim()))">
      ${n.img?'' : `<input type="file" accept="image/*" onchange="uploadImg('${n.id}',event)">`}
      <div class="meta">
        <span>📝 ${wordCount(n.content)} كلمة</span>
        <span>📅 ${new Date(n.created).toLocaleDateString('ar')}</span>
      </div>
      <div class="footer">
        <button onclick="exportTxt('${n.id}')">📄 TXT</button>
        <button onclick="del('${n.id}')">🗑️ حذف</button>
      </div>
    </div>
  `).join('');
}

function toggleDark(){
  dark=!dark; document.body.classList.toggle('dark');
  localStorage.setItem('dark',dark?1:0);
}

document.getElementById('search').oninput=render;
render();

// أزرار النسخ الاحتياطي
let extraBtns = document.createElement('div');
extraBtns.innerHTML = `
  <button class="btn ghost" onclick="backup()">💾 نسخ JSON</button>
  <label class="btn ghost" style="cursor:pointer">📂 استرجاع
    <input type="file" accept=".json" onchange="restore(event)" style="display:none">
  </label>
`;
document.querySelector('header').append(extraBtns);
</script>
</body>
</html>
