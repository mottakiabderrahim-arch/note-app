<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Speech Any Word</title>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
background:#f5f7fb;
}

.card{
background:white;
padding:20px;
border-radius:20px;
max-width:400px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

input{
padding:10px;
width:80%;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin:10px;
padding:10px 15px;
border:none;
border-radius:10px;
background:#1976d2;
color:white;
cursor:pointer;
}

#result{
margin-top:15px;
font-size:18px;
font-weight:bold;
}

.correct{color:green}
.wrong{color:red}
</style>
</head>

<body>

<div class="card">

<h2>🎤 Speak ANY Word</h2>

<input id="target" placeholder="اكتب الكلمة الصحيحة هنا">

<br>

<button onclick="start()">🎤 Speak Now</button>

<div id="result"></div>

</div>

<script>

function start(){

let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Not supported");
return;
}

let recognition = new SpeechRecognition();
recognition.lang = "en-US";
recognition.start();

recognition.onresult = function(e){

let spoken = e.results[0][0].transcript.toLowerCase();
let target = document.getElementById("target").value.toLowerCase();

if(target === ""){
document.getElementById("result").innerHTML =
"⚠️ اكتب الكلمة أولا";
return;
}

if(spoken.includes(target)){
document.getElementById("result").innerHTML =
"✅ صحيح! قلت: " + spoken;
document.getElementById("result").className="correct";
}else{
document.getElementById("result").innerHTML =
"❌ خطأ: " + spoken;
document.getElementById("result").className="wrong";
}
};

recognition.onerror = function(){
document.getElementById("result").innerHTML =
"خطأ في الصوت";
};
}

</script>

</body>
</html>
