<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Word Book</title>
</head>
<body>

<h2>Hello - مرحبا</h2>
<button onclick="speakWord('Hello')">🔊 نطق</button>

<h2>Book - كتاب</h2>
<button onclick="speakWord('Book')">🔊 نطق</button>

<script>
function speakWord(word) {
  var speech = new SpeechSynthesisUtterance(word);
  speech.lang = "en-US";
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
