<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>50 كلمة فرنسية مع TTS</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
.word { margin-bottom: 10px; }
button { margin-left: 10px; }
</style>
</head>
<body>
<h2>50 كلمة فرنسية مع الترجمة</h2>
<div id="words"></div>

<script>
// قائمة 50 كلمة فرنسية مع الترجمة العربية
const wordList = [
  {fr:"bonjour", ar:"مرحبا"},
  {fr:"merci", ar:"شكرا"},
  {fr:"amour", ar:"حب"},
  {fr:"maison", ar:"منزل"},
  {fr:"chat", ar:"قط"},
  {fr:"chien", ar:"كلب"},
  {fr:"livre", ar:"كتاب"},
  {fr:"école", ar:"مدرسة"},
  {fr:"pomme", ar:"تفاح"},
  {fr:"eau", ar:"ماء"},
  {fr:"pain", ar:"خبز"},
  {fr:"soleil", ar:"شمس"},
  {fr:"lune", ar:"قمر"},
  {fr:"voiture", ar:"سيارة"},
  {fr:"village", ar:"قرية"},
  {fr:"ville", ar:"مدينة"},
  {fr:"fleur", ar:"زهرة"},
  {fr:"arbre", ar:"شجرة"},
  {fr:"mer", ar:"بحر"},
  {fr:"montagne", ar:"جبل"},
  {fr:"oiseau", ar:"طائر"},
  {fr:"poisson", ar:"سمكة"},
  {fr:"fenêtre", ar:"نافذة"},
  {fr:"porte", ar:"باب"},
  {fr:"chaise", ar:"كرسي"},
  {fr:"table", ar:"طاولة"},
  {fr:"jour", ar:"يوم"},
  {fr:"nuit", ar:"ليل"},
  {fr:"temps", ar:"زمن"},
  {fr:"heure", ar:"ساعة"},
  {fr:"ami", ar:"صديق"},
  {fr:"famille", ar:"عائلة"},
  {fr:"enfant", ar:"طفل"},
  {fr:"faim", ar:"جوع"},
  {fr:"soif", ar:"عطش"},
  {fr:"chanson", ar:"أغنية"},
  {fr:"musique", ar:"موسيقى"},
  {fr:"rue", ar:"شارع"},
  {fr:"pont", ar:"جسر"},
  {fr:"église", ar:"كنيسة"},
  {fr:"magasin", ar:"متجر"},
  {fr:"marché", ar:"سوق"},
  {fr:"hôtel", ar:"فندق"},
  {fr:"restaurant", ar:"مطعم"},
  {fr:"cinéma", ar:"سينما"},
  {fr:"théâtre", ar:"مسرح"},
  {fr:"ordinateur", ar:"حاسوب"},
  {fr:"téléphone", ar:"هاتف"},
  {fr:"vélo", ar:"دراجة"},
  {fr:"bus", ar:"حافلة"},
  {fr:"train", ar:"قطار"}
];

// إنشاء العناصر في الصفحة
const container = document.getElementById("words");
wordList.forEach(item => {
    const div = document.createElement("div");
    div.className = "word";
    
    // زر TTS
    const btn = document.createElement("button");
    btn.textContent = "🔊";
    btn.addEventListener("click", () => {
        const utter = new SpeechSynthesisUtterance(item.fr);
        utter.lang = "fr-FR";
        speechSynthesis.speak(utter);
    });
    
    div.textContent = `${item.fr} - ${item.ar} `;
    div.appendChild(btn);
    container.appendChild(div);
});
</script>
</body>
</html>
