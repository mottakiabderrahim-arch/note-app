<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفكرة بسيطة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #noteForm {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }
    #noteForm input, #noteForm textarea {
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    #noteForm button {
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4a90e2;
      color: white;
      border: none;
    }
    .note {
      background: #fff;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .note button {
      position: absolute;
      top: 10px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
    }
    .editBtn { right: 40px; color: #4a90e2; }
    .shareBtn { right: 10px; color: green; }
  </style>
</head>
<body>

<h1>مفكرة بسيطة</h1>

<div id="noteForm">
  <input type="text" id="noteTitle" placeholder="عنوان الملاحظة">
  <textarea id="noteContent" placeholder="محتوى الملاحظة..." rows="5"></textarea>
  <button onclick="saveNote()">حفظ الملاحظة</button>
</div>

<div id="notesContainer"></div>

<script>
  let notes = JSON.parse(localStorage.getItem('notes')) || [];

  function displayNotes() {
    const container = document.getElementById('notesContainer');
    container.innerHTML = '';
    notes.forEach((note, index) => {
      const noteDiv = document.createElement('div');
      noteDiv.className = 'note';
      noteDiv.innerHTML = `
        <h3>${note.title}</h3>
        <p>${note.content}</p>
        <button class="editBtn" onclick="editNote(${index})">تعديل</button>
        <button class="shareBtn" onclick="shareNote(${index})">مشاركة</button>
      `;
      container.appendChild(noteDiv);
    });
  }

  function saveNote() {
    const title = document.getElementById('noteTitle').value.trim();
    const content = document.getElementById('noteContent').value.trim();
    if(title === '' && content === '') return alert('الرجاء إدخال عنوان أو محتوى');

    // تحقق إذا كنا نعدل ملاحظة موجودة
    const editingIndex = document.getElementById('noteForm').getAttribute('data-editing');
    if(editingIndex !== null) {
      notes[editingIndex] = { title, content };
      document.getElementById('noteForm').removeAttribute('data-editing');
    } else {
      notes.push({ title, content });
    }

    localStorage.setItem('notes', JSON.stringify(notes));
    document.getElementById('noteTitle').value = '';
    document.getElementById('noteContent').value = '';
    displayNotes();
  }

  function editNote(index) {
    const note = notes[index];
    document.getElementById('noteTitle').value = note.title;
    document.getElementById('noteContent').value = note.content;
    document.getElementById('noteForm').setAttribute('data-editing', index);
  }

  function shareNote(index) {
    const note = notes[index];
    if(navigator.share) {
      navigator.share({
        title: note.title,
        text: note.content
      }).catch(err => console.log(err));
    } else {
      alert('المشاركة غير مدعومة في هذا المتصفح.');
    }
  }

  // عرض الملاحظات عند التحميل
  displayNotes();
</script>

</body>
</html>
