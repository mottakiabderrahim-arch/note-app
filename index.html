<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاحظاتي Pro Plus</title>
<style>
:root{
  --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b;
  --accent:#6366f1; --border:#e2e8f0; --shadow:0 2px 8px rgba(0,0,0,.08)
}
.dark{--bg:#0b1220; --card:#111827; --text:#e5e7eb; --muted:#94a3b8;
  --border:#1f2937; --shadow:0 4px 16px rgba(0,0,0,.4)}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.25s}
header{position:sticky;top:0;background:var(--card);padding:12px 16px;
  display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);z-index:10;flex-wrap:wrap}
header input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--text);outline:none}
.btn{padding:9px 12px;border:none;border-radius:9px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.container{max-width:1100px;margin:20px auto;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.note{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.note.pinned{border-color:var(--accent)}
.note h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.note textarea{flex:1;min-height:110px;border:none;outline:none;background:transparent;
  color:var(--text);resize:vertical;font-size:14px;line-height:1.6}
.meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.footer{display:flex;gap:6px;flex-wrap:wrap}
.footer button{padding:6px 9px;font-size:12px;border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer}
.footer button:hover{background:var(--bg)}
.lock-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:99}
.lock-box{background:var(--card);padding:26px;border-radius:16px;box-shadow:var(--shadow);
  text-align:center;width:320px;border:1px solid var(--border)}
.lock-box input{width:100%;padding:10px;border:1px solid var(--border);
  border-radius:8px;margin:10px 0;background:var(--bg);color:var(--text)}
.hidden{display:none}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.toolbar button{padding:5px 7px;font-size:12px}
</style>
</head>
<body>
<div id="lockScreen" class="lock-screen">
  <div class="lock-box">
    <h2>🔒 كلمة السر</h2>
    <input type="password" id="pwdInput" placeholder="دخل كلمة السر">
    <button class="btn" onclick="unlock()">دخول</button>
    <p style="font-size:12px;color:var(--muted)">أول مرة؟ دخل أي كلمة سر للتسجيل</p>
  </div>
</div>

<header>
  <input type="text" id="search" placeholder="🔍 بحث فالملاحظات والتصنيفات...">
  <button class="btn ghost" onclick="toggleDark()">🌓</button>
  <button class="btn" onclick="newNote()">+ ملاحظة</button>
  <button class="btn ghost" onclick="backup()">💾 JSON</button>
  <label class="btn ghost" style="cursor:pointer">📂 استرجاع
    <input type="file" accept=".json" onchange="restore(event)" style="display:none">
  </label>
</header>

<div class="container">
  <div id="notesGrid" class="grid"></div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem('notes_pro')||'[]');
let dark = localStorage.getItem('dark')==='1';
let pwd = localStorage.getItem('pwd_pro');

if(dark) document.body.classList.add('dark');
if(!pwd) document.getElementById('lockScreen').classList.remove('hidden');
else document.getElementById('lockScreen').classList.add('hidden');

function unlock(){
  let v = document.getElementById('pwdInput').value;
  if(!pwd){ localStorage.setItem('pwd_pro',v); }
  if(v===localStorage.getItem('pwd_pro')){
    document.getElementById('lockScreen').classList.add('hidden');
  } else alert('كلمة السر غلط');
}

function save(){ localStorage.setItem('notes_pro',JSON.stringify(notes)); render(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }

function newNote(){
  notes.unshift({id:uid(),title:'ملاحظة جديدة',content:'',tags:[],pinned:false,img:null,created:Date.now()});
  save();
}

function del(id){ if(confirm('مسح الملاحظة؟')){ notes=notes.filter(n=>n.id!=id); save(); } }
function togglePin(id){ let n=notes.find(x=>x.id==id); n.pinned=!n.pinned;
  notes.sort((a,b)=>b.pinned-a.pinned); save(); }
function update(id,field,val){ let n=notes.find(x=>x.id==id); n[field]=val; save(); }

function uploadImg(id,e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=()=>{ update(id,'img',r.result); }
  r.readAsDataURL(f);
}

function exportTxt(id){
  let n=notes.find(x=>x.id==id);
  let blob=new Blob([n.title+'\n\n'+n.content],{type:'text/plain;charset=utf-8'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(n.title||'note')+'.txt'; a.click();
}

function backup(){
  let blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='backup_notes_'+Date.now()+'.json'; a.click();
}

function restore(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=()=>{ try{ notes=JSON.parse(r.result); save(); }catch{ alert('ملف غير صالح') } }
  r.readAsText(f);
}

function wordCount(txt){ return txt.trim().split(/\s+/).filter(Boolean).length }

function applyFormat(id,cmd){
  let ta = document.querySelector(`[data-id="${id}"]`);
  let start = ta.selectionStart, end = ta.selectionEnd;
  let txt = ta.value;
  let before = txt.slice(0,start), sel = txt.slice(start,end), after = txt.slice(end);
  let wrap = cmd==='bold'?'**':cmd==='italic'?'*':'';
  ta.value = before + wrap + sel + wrap + after;
  update(id,'content',ta.value);
}

function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let filtered=notes.filter(n=>
    n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q) ||
    n.tags.join(' ').toLowerCase().includes(q)
  );
  document.getElementById('notesGrid').innerHTML=filtered.map(n=>`
    <div class="note ${n.pinned?'pinned':''}">
      <h3>
        <input value="${n.title}" oninput="update('${n.id}','title',this.value)"
          style="border:none;background:transparent;color:var(--text);font-weight:700;flex:1">
        <span style="cursor:pointer;font-size:18px" onclick="togglePin('${n.id}')">${n.pinned?'📌':'📍'}</span>
      </h3>
      <div class="toolbar">
        <button onclick="applyFormat('${n.id}','bold')"><b>B</b></button>
        <button onclick="applyFormat('${n.id}','italic')"><i>I</i></button>
      </div>
      <textarea data-id="${n.id}" oninput="update('${n.id}','content',this.value)">${n.content}</textarea>
      ${n.img?`<img src="${n.img}" style="max-width:100%;border-radius:8px">`:''}
      <input type="text" placeholder="تصنيفات بفاصلة" value="${n.tags.join(',')}"
        oninput="update('${n.id}','tags',this.value.split(',').map(t=>t.trim()))">
      ${n.img?'' : `<input type="file" accept="image/*" onchange="uploadImg('${n.id}',event)">`}
      <div class="meta">
        <span>📝 ${wordCount(n.content)} كلمة</span>
        <span>📅 ${new Date(n.created).toLocaleDateString('ar-EG')}</span>
      </div>
      <div class="footer">
        <button onclick="exportTxt('${n.id}')">📄 TXT</button>
        <button onclick="del('${n.id}')">🗑️ حذف</button>
      </div>
    </div>
  `).join('');
}

function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('dark',document.body.classList.contains('dark')?1:0);
}

document.getElementById('search').oninput=render;
render();
</script>
</body>
</html>
