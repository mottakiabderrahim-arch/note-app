<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفكرة بسيطة</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
padding:20px;
}

h2{
color:#333;
}

textarea{
width:90%;
height:80px;
padding:10px;
font-size:16px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.delete{
background:red;
}

.note{
background:white;
padding:10px;
margin:10px;
border-radius:5px;
box-shadow:0 0 5px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h2>📒 مفكرتي</h2>

<textarea id="noteInput" placeholder="اكتب ملاحظة..."></textarea>
<br>

<button onclick="addNote()">إضافة</button>
<button onclick="exportPDF()">تصدير PDF</button>

<div id="notes"></div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function saveNotes(){
localStorage.setItem("notes", JSON.stringify(notes));
}

function displayNotes(){
let container = document.getElementById("notes");
container.innerHTML="";

notes.forEach((note,index)=>{
let div = document.createElement("div");
div.className="note";

div.innerHTML =
"<p>"+note+"</p>"+
"<button class='delete' onclick='deleteNote("+index+")'>حذف</button>";

container.appendChild(div);
});
}

function addNote(){
let input=document.getElementById("noteInput");

if(input.value.trim()!=""){
notes.push(input.value);
input.value="";
saveNotes();
displayNotes();
}
}

function deleteNote(index){
notes.splice(index,1);
saveNotes();
displayNotes();
}

displayNotes();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
function exportPDF(){
  var element = document.body;
  html2pdf().from(element).save("notes.pdf");
}
</script>

</body>
</html>
