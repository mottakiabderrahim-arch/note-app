<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ترجمة الكلمات FR → EN, IT, ES, DE, PT + حفظ</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  text-align:center;
}

textarea{
  width:90%;
  height:150px;
  font-size:16px;
  margin:10px;
}

button{
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
  margin:10px;
}

table{
  margin:auto;
  border-collapse:collapse;
  width:95%;
  background:white;
}

td,th{
  border:1px solid #999;
  padding:8px;
  text-align:center;
}

th{
  background:#ddd;
}
</style>

</head>
<body>

<h2>ترجمة الكلمات من الفرنسية إلى الإنجليزية والإيطالية والإسبانية والألمانية والبرتغالية</h2>

<textarea id="words" placeholder="ضع الكلمات الفرنسية هنا (كل كلمة في سطر)"></textarea>
<br>
<button onclick="createTable()">إنشاء الجدول</button>
<button onclick="translateWords()">ترجم</button>
<button onclick="downloadCSV()">حفظ CSV</button>

<table id="table">
<tr>
<th>Français</th>
<th>English</th>
<th>Italiano</th>
<th>Español</th>
<th>Deutsch</th>
<th>Português</th>
</tr>
</table>

<script>

// إنشاء الجدول من الكلمات الفرنسية
function createTable(){
  let text = document.getElementById("words").value;
  let words = text.split("\n").filter(w => w.trim() !== "");
  let table = document.getElementById("table");

  while(table.rows.length > 1){
    table.deleteRow(1);
  }

  for(let i = 0; i < words.length; i++){
    let row = table.insertRow(-1);
    row.insertCell(0).innerText = words[i];
    for(let j = 1; j <=5; j++){
      row.insertCell(j).innerText = "...";
    }
  }
}

// ترجمة الكلمات للغات المختلفة
async function translateWords(){
  let table = document.getElementById("table");
  let langs = ['en','it','es','de','pt'];

  for(let i = 1; i < table.rows.length; i++){
    let fr = table.rows[i].cells[0].innerText;

    for(let j = 0; j < langs.length; j++){
      let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${langs[j]}&dt=t&q=${encodeURIComponent(fr)}`;
      try{
        let res = await fetch(url);
        let data = await res.json();
        table.rows[i].cells[j+1].innerText = data[0][0][0];
      }catch(err){
        table.rows[i].cells[j+1].innerText = "خطأ";
        console.error(err);
      }
    }
  }
}

// حفظ الجدول كـ CSV
function downloadCSV(){
  let table = document.getElementById("table");
  let csv = [];
  for(let i = 0; i < table.rows.length; i++){
    let row = [];
    for(let j = 0; j < table.rows[i].cells.length; j++){
      let cellText = table.rows[i].cells[j].innerText.replace(/"/g,'""');
      row.push(`"${cellText}"`);
    }
    csv.push(row.join(","));
  }
  let csvString = csv.join("\n");
  let blob = new Blob([csvString], {type: 'text/csv;charset=utf-8;'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = 'translations.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>

</body>
</html>
