<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اختبار النطق</title>

<style>
body {
    font-family: Arial;
    background: #121212;
    color: white;
    text-align: center;
}

.word {
    font-size: 30px;
    margin-top: 30px;
}

button {
    padding: 15px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #00c853;
    color: white;
    font-size: 18px;
}

#result {
    font-size: 25px;
    margin-top: 20px;
}
</style>

</head>

<body>

<h1>🎤 اختبار النطق</h1>

<div class="word" id="target">Hello</div>

<button onclick="start()">🎙️ نطق</button>

<div id="result"></div>

<script>
let targetWord = "hello";

function start() {
    let recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    recognition.onresult = function(event) {
        let spoken = event.results[0][0].transcript.toLowerCase();
        check(spoken);
    };
}

function check(spoken) {
    if (spoken === targetWord) {
        document.getElementById("result").innerHTML = "✅ صحيح";
    } else {
        document.getElementById("result").innerHTML = "❌ خطأ (قلت: " + spoken + ")";
    }
}
</script>

</body>
</html>
