<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مفكرة بسيطة</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
font-family:Arial;
background:#f0f0f0;
text-align:center;
margin:20px;
}

textarea{
width:90%;
height:200px;
font-size:16px;
padding:10px;
}

button{
padding:10px;
margin:5px;
font-size:16px;
cursor:pointer;
}

#notes{
background:white;
padding:10px;
margin-top:10px;
border:1px solid #ccc;
}
</style>
</head>

<body>

<h2>مفكرة</h2>

<textarea id="noteText" placeholder="اكتب ملاحظتك هنا"></textarea>

<br>

<button onclick="saveNote()">حفظ</button>
<button onclick="loadNote()">تحميل</button>

<button onclick="exportPDF()">PDF</button>
<button onclick="exportCSV()">CSV</button>

<div id="notes"></div>

<script>

// حفظ الملاحظة
function saveNote(){

let text=document.getElementById("noteText").value

localStorage.setItem("note",text)

document.getElementById("notes").innerText=text

alert("تم الحفظ")

}

// تحميل الملاحظة
function loadNote(){

let text=localStorage.getItem("note") || ""

document.getElementById("noteText").value=text

document.getElementById("notes").innerText=text

}

// تصدير PDF
function exportPDF(){

let element=document.getElementById("notes")

if(!element.innerText){
alert("لا توجد ملاحظة")
return
}

html2pdf().from(element).save("note.pdf")

}

// تصدير CSV
function exportCSV(){

let text=document.getElementById("noteText").value

if(!text){
alert("لا توجد ملاحظة")
return
}

let blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8;"})

let url=URL.createObjectURL(blob)

let a=document.createElement("a")

a.href=url

a.download="note.csv"

document.body.appendChild(a)

a.click()

document.body.removeChild(a)

}

</script>

</body>
</html>
