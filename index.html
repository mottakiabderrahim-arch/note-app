<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arabic - French TTS</title>
<style>
body{font-family:Arial;padding:15px;background:#f4f4f4}
.word{background:white;margin:8px 0;padding:10px;border-radius:8px;
display:flex;justify-content:space-between;align-items:center}
button{background:#4CAF50;color:white;border:none;padding:6px 10px;
border-radius:6px;font-size:16px}
button:active{background:#45a049}
</style>
</head>
<body>

<h2>تعلم الفرنسية 🔊</h2>

<div id="list"></div>

<script>
const words = [
["سلام","Bonjour"],
["وداعاً","Au revoir"],
["شكراً","Merci"],
["من فضلك","S’il vous plaît"],
["نعم","Oui"],
["لا","Non"],
["صباح الخير","Bonjour"],
["مساء الخير","Bonsoir"],
["تصبح على خير","Bonne nuit"],
["كيف حالك؟","Comment ça va ?"],
["أنا","Je"],
["أنت","Tu"],
["هو","Il"],
["هي","Elle"],
["نحن","Nous"],
["أنتم","Vous"],
["هم","Ils"],
["ماء","Eau"],
["خبز","Pain"],
["حليب","Lait"],
["قهوة","Café"],
["شاي","Thé"],
["سكر","Sucre"],
["ملح","Sel"],
["طعام","Nourriture"],
["بيت","Maison"],
["مدرسة","École"],
["مستشفى","Hôpital"],
["سوق","Marché"],
["شارع","Rue"],
["كتاب","Livre"],
["قلم","Stylo"],
["كرسي","Chaise"],
["طاولة","Table"],
["باب","Porte"],
["نافذة","Fenêtre"],
["سيارة","Voiture"],
["حافلة","Bus"],
["قطار","Train"],
["طائرة","Avion"],
["يوم","Jour"],
["أسبوع","Semaine"],
["شهر","Mois"],
["سنة","Année"],
["كبير","Grand"],
["صغير","Petit"],
["جميل","Beau"],
["سريع","Rapide"],
["بطيء","Lent"],
["صديق","Ami"]
];

function speak(text){
let speech = new SpeechSynthesisUtterance(text);
speech.lang = "fr-FR";
window.speechSynthesis.speak(speech);
}

const list = document.getElementById("list");

words.forEach(w=>{
let div = document.createElement("div");
div.className="word";
div.innerHTML = `<span>${w[0]} — ${w[1]}</span>
<button onclick="speak('${w[1]}')">🔊</button>`;
list.appendChild(div);
});
</script>

</body>
</html>
