<div id="list"></div>
<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJQcQnjFu2vPjnN6rrsE7LEdOc3gXYwEKkXlG9DdZ-leU4m4N3tNdwdV8hv3OXgugFqO4_SlGGNrLS/pub?gid=318993721&single=true&output=csv";

fetch(csvUrl)
  .then(res => res.text())
  .then(data => {
    const rows = data.split("\n");
    let html = "";
    rows.forEach(row => {
      const cols = row.split(",");
      const arabic = cols[0];
      const french = cols[1];
      const mp3 = cols[2];
      html += `
        <div style="border:1px solid #ccc; padding:10px; margin:5px;">
          <strong>${arabic}</strong> - ${french} 
          <button onclick="new Audio('${mp3}').play()">Play</button>
        </div>`;
    });
    document.getElementById("list").innerHTML = html;
  });
</script>
