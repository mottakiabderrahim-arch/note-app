<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>TTS ZIP FIX</title>
</head>
<body>

<textarea id="text" rows="6" cols="40">مرحبا هذا اختبار</textarea>

<br><br>

<select id="lang">
  <option value="ar">العربية</option>
  <option value="en">English</option>
  <option value="fr">Français</option>
</select>

<br><br>

<button onclick="speakAndZip()">🎧 توليد ZIP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
function speakAndZip() {
    let text = document.getElementById("text").value;
    let lang = document.getElementById("lang").value;

    let utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;

    let audioChunks = [];

    let mediaStream = new (window.MediaRecorder || window.webkitMediaRecorder)(window.MediaStream || window.AudioContext);

    // ❗ الطريقة المبسطة: نحولو مباشرة لصوت ونخزنو كنص داخل ZIP
    let zip = new JSZip();

    zip.file("text.txt", text);

    speechSynthesis.speak(utter);

    setTimeout(async () => {
        let blob = new Blob([text], {type: "text/plain"});
        zip.file("audio.txt", blob);

        let content = await zip.generateAsync({type:"blob"});

        let a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "result.zip";
        a.click();

    }, 2000);
}
</script>

</body>
</html>
