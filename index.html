<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>TTS + Language</title>
</head>
<body>

<textarea id="text" rows="6" cols="40">مرحبا</textarea>

<br><br>

<select id="lang">
  <option value="ar">العربية</option>
  <option value="en">English</option>
  <option value="fr">Français</option>
  <option value="es">Español</option>
</select>

<br><br>

<button onclick="makeZip()">🎧 توليد MP3 + ZIP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
async function makeZip() {
    let text = document.getElementById("text").value;
    let lang = document.getElementById("lang").value;

    let url = "https://translate.google.com/translate_tts?ie=UTF-8&q="
        + encodeURIComponent(text)
        + "&tl=" + lang
        + "&client=tw-ob";

    let res = await fetch(url);
    let audioBlob = await res.blob();

    let zip = new JSZip();
    zip.file("audio.mp3", audioBlob);

    let content = await zip.generateAsync({type:"blob"});

    let a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "audio_zip.zip";
    a.click();
}
</script>

</body>
</html>
